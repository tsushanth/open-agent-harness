[project]
name = "open-agent-harness"
version = "0.1.0"
description = "A Claude-Code-style tool-use agent harness for open coding models, with trajectory logging for SFT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.30.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "anthropic>=0.30.0"]
eval = ["transformers>=4.40.0", "peft>=0.11.0", "anthropic>=0.30.0"]

[project.scripts]
oah = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
